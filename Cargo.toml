[package]
name = "rust-learn"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.11"
actix-service = "2.0.3"
base64 = "0.22"
futures = "0.3"
getrandom = "0.2"
diesel = { version = "2.2.12", features = ["postgres", "chrono", "numeric", "serde_json"] }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"] }
dotenvy = "0.15"
diesel_migrations = "2.2.0"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_urlencoded = "0.7"
serde_json = "1"
bcrypt = "0.17"
jsonwebtoken = "9"
log = "0.4"
openssl = "0.10"
sha2 = "0.10"
strum = "0.27"
strum_macros = "0.27"
time = "0.3.41"
ethers = "2.0.14"
ethers-solc = { version = "2", features = ["svm"] }

http = "1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# For decoding solc .bin hex output in the solc fallback
hex = "0.4"

# S3-compatible object storage (replaces minio crate)
aws-config = "1.5"
aws-sdk-s3 = "1.49"

# Async runtime used by actix and for S3 helpers
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync"] }
anyhow = "1.0"
bigdecimal = { version = "0.4", default-features = true, features = ["serde"] }

[features]
default = []
app-bin = []
worker-bin = []
tool-bin = []

[profile.test]
debug = 0
incremental = false

[dev-dependencies]
# used only by tests to generate random mnemonics
bip39 = "1.1"

[[bin]]
name = "rust-learn"
path = "src/main.rs"
required-features = ["app-bin"]
test = false
bench = false

[[bin]]
name = "worker"
path = "src/bin/worker.rs"
required-features = ["worker-bin"]
test = false
bench = false

[[bin]]
name = "mock_email"
path = "src/bin/mock_email.rs"
required-features = ["tool-bin"]
test = false
bench = false

[[bin]]
name = "abi_export"
path = "src/bin/abi_export.rs"
required-features = ["tool-bin"]
test = false
bench = false

[[test]]
name = "blockchain_integration_tests"
path = "tests/blockchain_integration_tests.rs"
harness = true

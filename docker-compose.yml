services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ETH_HOST: anvil
      ETH_PORT: "8545"
      ETH_RPC_URL: http://anvil:8545
      PROD_MODE: "TRUE"
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/src/app
      - cargo_disk:/usr/local/cargo
    depends_on:
      - db
      - anvil
      - rustfs
    # Use the app entrypoint script which:
    # - initializes git submodules
    # - if PROD_MODE=TRUE runs diesel migrations and starts the app
    # - otherwise sleeps indefinitely to keep the container alive
    command: /usr/src/app/scripts/app-entrypoint.sh

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      # Keep browser requests same-origin; Next proxies /api and /health to API_URL.
      - NEXT_PUBLIC_API_URL=/api
      - API_URL=http://app:8080
    depends_on:
      - app

  db:
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  anvil:
    image: ghcr.io/foundry-rs/foundry:nightly
    entrypoint: ["/anvil-entrypoint.sh"]
    env_file:
      - .env
    environment:
      ANVIL_IP_ADDR: 0.0.0.0
    ports:
      - "8545:8545"
    volumes:
      - anvil_state:/anvil
      - ./scripts/anvil-entrypoint.sh:/anvil-entrypoint.sh:ro
    user: root
    stop_signal: SIGINT
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      ETH_HOST: anvil
      ETH_PORT: "8545"
      ETH_RPC_URL: http://anvil:8545
      # concurrency for ffmpeg workers (default 1)
      WORKER_CONCURRENCY: "1"
      # retry/backoff configuration
      WORKER_MAX_ATTEMPTS: "5"
      WORKER_BASE_BACKOFF_SECONDS: "60"
      WALLET_DEPOSIT_INDEXER_ENABLED: "true"
      WALLET_DEPOSIT_INDEXER_POLL_SECONDS: "15"
      WALLET_DEPOSIT_INDEXER_CONFIRMATIONS: "1"
      WALLET_DEPOSIT_INDEXER_BATCH_BLOCKS: "500"
      WALLET_DEPOSIT_INDEXER_LOOKBACK_BLOCKS: "100"
      LEARN_TOKEN_DECIMALS: "18"
    volumes:
      - .:/usr/src/app
      - cargo_disk:/usr/local/cargo
    depends_on:
      - db
      - rustfs
      - anvil
    # Run the prebuilt worker binary in the image (avoid building in the container)
    command: /usr/local/bin/worker
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 2m
    healthcheck:
      # Escape $ to avoid Compose env interpolation; compute file mtime delta < 120s
      test: ["CMD-SHELL", "if [ -f /tmp/worker_alive ]; then last=$$(stat -c %Y /tmp/worker_alive); now=$$(date +%s); diff=$$((now-last)); if [ $$diff -lt 120 ]; then exit 0; else exit 1; fi; else exit 1; fi"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G

  test-runner:
    build:
      context: .
      dockerfile: docker/test-runner.Dockerfile
    profiles:
      - test
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      ETH_HOST: anvil
      ETH_PORT: "8545"
      ETH_RPC_URL: http://anvil:8545
      S3_INTERNAL_DOMAIN: rustfs
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /usr/local/cargo/target
    volumes:
      - .:/usr/src/app
      - cargo_disk:/usr/local/cargo
    depends_on:
      - db
      - rustfs
      - anvil

volumes:
  postgres_data:
  cargo_disk:
  rustfs_data:
  anvil_state:

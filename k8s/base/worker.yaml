apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: rust-learn
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: rust-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/worker"]
          envFrom:
            - configMapRef:
                name: worker-config
            - configMapRef:
                name: app-config
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: app-secrets
            - secretRef:
                name: s3-secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/worker-healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /usr/local/bin/worker-healthcheck
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: rust-learn
type: Opaque
stringData:
  POSTGRES_USER: "your_username"
  POSTGRES_PASSWORD: "your_password"
  POSTGRES_DB: "your_db_name"
  DATABASE_URL: "postgres://your_username:your_password@postgres:5432/your_db_name"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: rust-learn
type: Opaque
stringData:
  PRIVATE_KEY: |
    replace-with-rsa-private-key
  PUBLIC_KEY: |
    replace-with-rsa-public-key
  ETH_MNEMONIC: "replace-with-ethereum-mnemonic"
  ADMIN_NAME: "admin"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "replace-with-admin-password"
  ADMIN_DATE_OF_BIRTH: "1990-01-01"
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
  namespace: rust-learn
type: Opaque
stringData:
  S3_ACCESS_KEY: "replace-with-s3-access-key"
  S3_SECRET_KEY: "replace-with-s3-secret-key"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-app
  namespace: rust-learn
  labels:
    app: rust-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-app
  template:
    metadata:
      labels:
        app: rust-app
    spec:
      initContainers:
        - name: migrate
          image: rust-app:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              runtime_diesel_config="$(mktemp)"
              trap 'rm -f "$runtime_diesel_config"' EXIT

              for i in {1..60}; do
                if diesel migration run --config-file "$runtime_diesel_config"; then
                  echo "[migrate] Migrations applied"
                  exit 0
                fi
                echo "[migrate] Diesel migration attempt $i failed; retrying in 2s..."
                sleep 2
              done
              echo "[migrate] Migrations failed after 60 attempts"
              exit 1
          envFrom:
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
        - name: wait-for-runtime-services
          image: rust-app:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              wait_for_tcp() {
                local name="$1"
                local host="$2"
                local port="$3"

                for i in {1..120}; do
                  if timeout 2 bash -c ":</dev/tcp/${host}/${port}" 2>/dev/null; then
                    echo "[wait] ${name} is reachable at ${host}:${port}"
                    return 0
                  fi
                  echo "[wait] ${name} not ready at ${host}:${port}; retrying in 2s..."
                  sleep 2
                done

                echo "[wait] ${name} did not become reachable at ${host}:${port}"
                return 1
              }

              wait_for_tcp "Anvil" "anvil" "8545"
              wait_for_tcp "RustFS" "rustfs" "9000"
      containers:
        - name: rust-app
          image: rust-app:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/src/app/scripts/app-entrypoint.sh"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: app-secrets
            - secretRef:
                name: s3-secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: rust-app
  namespace: rust-learn
spec:
  selector:
    app: rust-app
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: rust-app-external
  namespace: rust-learn
spec:
  selector:
    app: rust-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort

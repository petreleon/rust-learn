name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: rust_learn_test
          POSTGRES_USER: rust_learn
          POSTGRES_PASSWORD: rust_learn
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rust_learn -d rust_learn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
          - 9001:9001
    env:
      DATABASE_URL: postgres://rust_learn:rust_learn@localhost:5433/rust_learn_test
      POSTGRES_DB: rust_learn_test
      POSTGRES_USER: rust_learn
      POSTGRES_PASSWORD: rust_learn
      ADMIN_NAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: supersecretpassword
      ADMIN_DATE_OF_BIRTH: 1990-01-01
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      S3_INTERNAL_DOMAIN: localhost
      S3_INTERNAL_PORT: "9000"
      S3_INTERNAL_SCHEME: http
      S3_EXTERNAL_DOMAIN: localhost
      S3_EXTERNAL_PORT: "9000"
      S3_EXTERNAL_SCHEME: http
      ETH_MNEMONIC: test test test test test test test test test test test junk
      ETH_CHAIN_ID: "31337"
      ETH_RPC_URL: http://localhost:8545
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y curl ffmpeg libpq-dev lld openssl pkg-config

      - name: Generate CI JWT keys
        run: |
          openssl genpkey -algorithm RSA -out private.key -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in private.key -out public.key
          {
            echo "PRIVATE_KEY<<EOF"
            cat private.key
            echo "EOF"
            echo "PUBLIC_KEY<<EOF"
            cat public.key
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Wait for RustFS
        run: |
          for attempt in {1..30}; do
            if curl -s http://localhost:9000 >/dev/null; then
              exit 0
            fi
            echo "Waiting for RustFS ($attempt/30)"
            sleep 2
          done
          exit 1

      - name: Install Diesel CLI
        run: cargo install diesel_cli --version 2.2.12 --no-default-features --features postgres --locked

      - name: Run database migrations
        run: diesel migration run

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        run: cargo test --jobs 1

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
